<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioCheck - Entrada</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pagInicial.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='imagens/favicon.ico') }}" type="image/x-icon">

</head>
<body>
  <div class="container">
    <button id="login-btn" class="btn home-btn login">Login</button>
    <button id="register-btn" class="btn home-btn register">Registo</button>
  </div>
  <div id="register-modal" class="modal"> 
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Registo</h2>
      <form id="registration-form" action="/register" method="post">
        <div class="form-item">
          <label for="full-name">Nome Completo:</label>
          <input type="text" id="full-name" name="full-name" required>
        </div>
        <div class="form-item">
          <label for="professional-id">Número de Cédula Profissional:</label>
          <input type="text" id="professional-id" name="professional-id" required>
        </div>
        <div class="form-item">
          <label for="email">Endereço de E-mail:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-item">
          <label for="phone">Número de Telemóvel:</label>
          <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="form-item">
          <label for="password">Palavra-Passe:</label>
          <input type="password" id="password" name="password" required>
          <div class="password-requirements">
            <span>• Uma letra maiúscula</span>
            <span>• Uma letra minúscula</span>
            <span>• Mínimo 8 caracteres</span>
            <span>• Um número</span>
          </div>
        </div>
        <div class="form-item">
          <label for="confirm-password">Confirmar Palavra-Passe:</label>
          <input type="password" id="confirm-password" name="confirm-password" required>
        </div>
        <div id="message-container" class="message" style="display:none;"></div>
        <div class="form-item">
          <button type="submit" class="btn register-btn">Registar</button>
        </div>
      </form>
    </div>
  </div>
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Login</h2>
      <form id="login-form" action="/login" method="post">
        <div class="form-item">
          <label for="login-email">Endereço de E-mail:</label>
          <input type="email" id="login-email" name="login-email" required>
        </div>
        <div class="form-item">
          <label for="login-password">Palavra-Passe:</label>
          <input type="password" id="login-password" name="login-password" required>
        </div>
        <div id="feedback-container" class="message" style="display:none;"></div>
        <div class="form-item">
          <button type="submit" class="btn login-btn">Login</button>
        </div>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='javaScript/pagInicial.js') }}"></script>
</body>
</html>
