<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardio Check</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/alterarPass.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='imagens/favicon.ico') }}" type="image/x-icon">

</head>
<body>
  <div class="sidebar">
    <div class="overlay_logo">
      <img class="logo" src="{{ url_for('static', filename='imagens/logo.png') }}" alt="Logo">
    </div>
    <form action="/utentes" method="GET">
      <button class="sidebar-button">
          <img class="list-icon" src="{{ url_for('static', filename='imagens/lista.png') }}" alt="Lista">
      </button>
    </form>

    <form action="/perfil" method="GET">
      <button class="sidebar-button">
          <img class="profile-icon" src="{{ url_for('static', filename='imagens/perfil.png') }}" alt="Perfil">
      </button>
    </form>

    <form action="/definicoes" method="GET">
      <button class="sidebar-button">
          <img class="settings-icon" src="{{ url_for('static', filename='imagens/definicoes.png') }}" alt="Definições">
      </button>
    </form>

  </div>
  

  <div id="ap-modal" class="modal"> 
    <div class="modal-content">  
      <form id="ap-form" action="/alterarPass" method="POST">
        
        <div class="form-item">
          <label for="password">Palavra-Passe atual</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="form-item">
          <label for="new-password">Nova Palavra-Passe</label>
          <input type="password" id="new-password" name="new-password" required>
          <div class="password-requirements">
            <span>• Uma letra maiúscula</span>
            <span>• Uma letra minúscula</span>
            <span>• Mínimo 8 caracteres</span>
            <span>• Um número</span>
          </div>
        </div>
        <div class="form-item">
          <label for="confirm-password">Confirmar nova Palavra-Passe</label>
          <input type="password" id="confirm-password" name="confirm-password" required>
        </div>
        <div id="message-container" class="message" style="display:none;"></div>
        <div class="form-item">
          <button type="submit" class="btn_menu btn_confirmar">Confirmar</button>
        </div>
      </form>
    </div>
  </div>


  <form action="/definicoes" method="GET">
      <button class="btn_menu btn_cancelar">Cancelar</button>
  </form>
    


  
<script src="{{ url_for('static', filename='javaScript/alterarPass.js') }}"></script>

</body>
</html>
